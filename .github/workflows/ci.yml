# Builds, tests and analyzes Journal on every push and pull request.
# The SonarQube Cloud step runs once the SONAR_TOKEN secret is set
# (repo Settings > Secrets and variables > Actions).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-analyze:
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: Sonar needs it for blame and new code

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config gcc libgtk-4-dev libgtk-4-bin \
            libsqlite3-dev libsodium-dev libsecret-1-dev libseccomp-dev mutter dbus dbus-daemon valgrind

      - name: Build (all warnings are errors)
        shell: bash
        run: |
          set -o pipefail
          meson setup build 2>&1 | tee build-setup.log
          meson compile -C build 2>&1 | tee build.log

      - name: Tests with coverage (UI tests on a private headless display)
        run: tools/coverage.sh

      - name: Valgrind (core tests; the network jail cannot run under Valgrind)
        run: >
          JR_TEST_WRAPPER='valgrind --leak-check=full --errors-for-leak-kinds=definite,indirect --error-exitcode=1 -q'
          meson test -C build --suite core --timeout-multiplier 4 --print-errorlogs

      - name: Static analyzer (GCC -fanalyzer)
        run: tools/analyze.sh

      - name: Report failures
        if: failure()
        shell: bash
        run: |
          # Annotations are readable without signing in, unlike job logs.
          grep -hE 'error:|ERROR|Dependency .* found: NO|warning:' build-setup.log build.log 2>/dev/null \
            | head -25 | sed 's/^/::error::/' || true
          for log in build*/meson-logs/testlog.txt; do
            [ -f "$log" ] && grep -hE '^not ok|ERROR:' "$log" | head -20 | sed 's/^/::error::/' || true
          done
          python3 -I tools/report-failures.py build*/meson-logs/testlog.json || true

      - name: SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config gcc libgtk-4-dev libgtk-4-bin \
            libsqlite3-dev libsodium-dev libsecret-1-dev libseccomp-dev mutter dbus dbus-daemon

      - name: Build with AddressSanitizer + UndefinedBehaviorSanitizer
        shell: bash
        run: |
          set -o pipefail
          meson setup build-asan -Db_sanitize=address,undefined -Dbuildtype=debug 2>&1 | tee build-setup.log
          meson compile -C build-asan 2>&1 | tee build.log

      - name: Core tests (leak detection on)
        run: meson test -C build-asan --suite core --print-errorlogs
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1 # undefined behaviour fails the test

      - name: Network jail tests
        run: meson test -C build-asan --suite sandbox --print-errorlogs
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

      - name: UI tests (GTK keeps global caches, so leak detection off)
        run: ASAN_OPTIONS=detect_leaks=0 meson test -C build-asan --suite ui --print-errorlogs
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

      - name: Report failures
        if: failure()
        shell: bash
        run: |
          grep -hE 'error:|ERROR|Dependency .* found: NO|warning:' build-setup.log build.log 2>/dev/null \
            | head -25 | sed 's/^/::error::/' || true
          grep -hE '^not ok|ERROR:' build-asan/meson-logs/testlog.txt 2>/dev/null | head -20 | sed 's/^/::error::/' || true
          python3 -I tools/report-failures.py build-asan/meson-logs/testlog.json || true

  fuzz:
    # Coverage-guided fuzzing with libFuzzer (clang), 2 minutes per target
    # on every push. What it learns is cached for the next run; a crash
    # fails the job and its input is uploaded (see fuzz/README.md).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [date, text, lockout, secrets, journal_file]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config clang libgtk-4-dev \
            libsqlite3-dev libsodium-dev libsecret-1-dev libseccomp-dev

      - name: Restore what earlier runs found
        uses: actions/cache@v6
        with:
          path: fuzz-corpus/${{ matrix.target }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-

      - name: Build with libFuzzer, AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          CC=clang meson setup build-fuzz -Dfuzz=true -Db_sanitize=address,undefined \
            -Db_lundef=false -Dbuildtype=debugoptimized -Dwerror=false
          meson compile -C build-fuzz fuzz_${{ matrix.target }}

      - name: Fuzz for 2 minutes
        run: tools/fuzz.sh ${{ matrix.target }} 120

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz-crashes/
