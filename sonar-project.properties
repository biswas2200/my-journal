# SonarQube analysis of Journal (C11 + GTK4).
# Run tools/coverage.sh first, then tools/sonar-scan.sh.
# The server URL and token are passed at runtime via SONAR_HOST_URL and
# SONAR_TOKEN; never store them in this file.
sonar.projectKey=Journal
sonar.projectName=Journal
sonar.projectVersion=1.0

sonar.sources=src,data,tools
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# C analysis needs a SonarQube edition with the C/C++ analyzer (not in
# Community Build). With one, it uses the compiler commands meson recorded.
sonar.cfamily.compile-commands=build/compile_commands.json
# Line coverage from gcov (written by tools/coverage.sh).
sonar.cfamily.gcov.reportsPath=build-cov/gcov-reports

# data/style.css is GTK CSS, not web CSS: GTK widgets are styled by node
# names (window, headerbar, entry, textview...) and states (:backdrop,
# :selected) that browser rules do not know. Only these two rules are
# switched off, and only for that folder; every other CSS rule applies.
sonar.issue.ignore.multicriteria=gtktype,gtkstate
sonar.issue.ignore.multicriteria.gtktype.ruleKey=css:S4670
sonar.issue.ignore.multicriteria.gtktype.resourceKey=data/**/*.css
sonar.issue.ignore.multicriteria.gtkstate.ruleKey=css:S4659
sonar.issue.ignore.multicriteria.gtkstate.resourceKey=data/**/*.css
